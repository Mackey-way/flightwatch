# /etc/wireguard/wg0.conf на ОБЛАКЕ (сервер: белый адрес у него).
#
# AllowedIPs узкие намеренно: облако достаёт РОВНО до одного адреса
# домашней машины и ни до чего больше в домашней сети.
# net.ipv4.ip_forward включать НЕ нужно — маршрутизации тут нет.
[Interface]
Address = 10.99.0.1/24
ListenPort = 51820
PrivateKey = <cloud-private-key>

[Peer]
# домашний сервер
PublicKey = <home-public-key>
AllowedIPs = 10.99.0.2/32

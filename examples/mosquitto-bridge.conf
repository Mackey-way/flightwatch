# /etc/mosquitto/conf.d/bridge.conf на ОБЛАЧНОЙ машине.
#
# Мост в дом через WireGuard. Инициирует облако — дом наружу не слушает.
# cleansession false — главное: пока туннель лежит, команды на СМС копятся
# в облачном брокере и уходят после восстановления, а не теряются.
connection home
address 10.99.0.2:1883
bridge_protocol_version mqttv311
remote_username fwbridge
remote_password CHANGE_ME
remote_clientid fw-cloud-bridge
start_type automatic
restart_timeout 5 30
keepalive_interval 30
cleansession false
notifications true
notifications_local_only true
notification_topic bridge/home/state
try_private false

# Строго перечисленные топики. Всё, чего тут нет, из облака в дом
# не попадает, даже если демон это опубликует.
topic openstick/CHANGE_ME/sms/send out 1
topic openstick/+/sms/sent in 1
